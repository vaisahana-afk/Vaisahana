name: Sync to Hugging Face
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout local repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push codebase straight to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git remote add hf https://vaisahana-afk:$HF_TOKEN@huggingface.co/spaces/vaisahana-afk/Vaisahana
          git push --force hf main
